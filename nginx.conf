server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Eleventy erzeugt Clean-URLs (ordner/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # /leistungen/ ist ein Anker auf der Startseite (vorher netlify.toml-Redirect)
    location = /leistungen/ {
        return 301 /#leistungen;
    }

    # Gzip fuer Text-Assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
