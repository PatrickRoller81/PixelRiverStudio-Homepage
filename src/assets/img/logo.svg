<svg width="400" height="420" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Chip Outline -->
  <rect x="80" y="40" width="240" height="240" rx="40" fill="none" stroke="#3b96ff" stroke-width="8"/>
  <!-- Chip Pins Top -->
  <g stroke="#3b96ff" stroke-width="6">
    <line x1="120" y1="40" x2="120" y2="20"/>
    <line x1="160" y1="40" x2="160" y2="20"/>
    <line x1="200" y1="40" x2="200" y2="20"/>
    <line x1="240" y1="40" x2="240" y2="20"/>
    <line x1="280" y1="40" x2="280" y2="20"/>
  </g>
  <!-- Chip Pins Bottom -->
  <g stroke="#3b96ff" stroke-width="6">
    <line x1="120" y1="280" x2="120" y2="300"/>
    <line x1="160" y1="280" x2="160" y2="300"/>
    <line x1="200" y1="280" x2="200" y2="300"/>
    <line x1="240" y1="280" x2="240" y2="300"/>
    <line x1="280" y1="280" x2="280" y2="300"/>
  </g>
  <!-- River -->
  <path d="M200 70 C160 120, 240 150, 200 200 C160 250, 240 270, 200 290" fill="none" stroke="#3b96ff" stroke-width="18" stroke-linecap="round"/>
  <!-- River Highlight -->
  <path d="M210 80 C180 120, 260 150, 210 200 C170 250, 250 270, 210 290" fill="none" stroke="#7bbeff" stroke-width="8" stroke-linecap="round"/>
  <!-- Pixel Squares -->
  <rect x="140" y="140" width="10" height="10" fill="#3b96ff"/>
  <rect x="155" y="160" width="8" height="8" fill="#3b96ff"/>
  <rect x="170" y="180" width="6" height="6" fill="#3b96ff"/>
  <!-- Text -->
  <text x="200" y="358" text-anchor="middle" font-family="Syne, sans-serif" font-size="28" fill="#3b96ff" font-weight="700">PixelRiver</text>
  <text x="200" y="390" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" fill="#e2e8f0" font-weight="400">Studio</text>
</svg>
