[build]
  base      = "."
  publish   = "_site"
  command   = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# DevLog-URLs auf /gaming/ umleiten (301, dauerhaft)
[[redirects]]
  from   = "/devlog/"
  to     = "/gaming/"
  status = 301
  force  = true

[[redirects]]
  from   = "/devlog/*"
  to     = "/gaming/:splat"
  status = 301
  force  = true

# /leistungen/ auf Startseite-Anker
[[redirects]]
  from   = "/leistungen/"
  to     = "/#leistungen"
  status = 301
  force  = true

# SPA-Fallback (404-Seite)
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
